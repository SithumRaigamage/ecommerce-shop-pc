<div class="bg-white dark:bg-[#1f2d3b] p-6 rounded-lg shadow-md">
  <h2 class="text-xl font-semibold text-indigo-700 text-center">Filters</h2>
  <div *ngFor="let option of filterOptions" class="mt-4">
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ option.label }}</label>
    <div *ngFor="let value of option.values">
      <label><input type="checkbox" /> {{ value }}</label>
    </div>
  </div>
</div>
